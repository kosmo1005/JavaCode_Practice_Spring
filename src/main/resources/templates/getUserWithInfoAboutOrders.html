<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>История заказов</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 600px;
        }

        h2 {
            color: #007bff;
        }

        .order {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            margin: 10px 0;
            background-color: #f1f1f1;
            text-align: left;
        }

        .goods-list {
            margin-top: 5px;
            padding-left: 15px;
        }

        .btn {
            display: inline-block;
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            margin-top: 20px;
        }

        .btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>История заказов</h2>
    <p><strong>Пользователь:</strong> <span th:text="${user.name}"></span></p>

    <div th:each="order : ${user.orders}" class="order">
        <p><strong>Статус:</strong> <span th:text="${order.status}"></span></p>
        <p><strong>Итоговая цена:</strong> <span th:text="${order.totalPrice}"></span> ₽</p>
        <h4>Товары:</h4>
        <ul class="goods-list">
            <li th:each="good : ${order.goods}">
                <span th:text="${good.name}"></span> — <span th:text="${good.price}"></span> ₽
            </li>
        </ul>
    </div>

    <a href="/app/auth/oauthSuccess" class="btn">Назад</a>
</div>

</body>
</html>
